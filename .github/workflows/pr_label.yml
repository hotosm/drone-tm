name: 🏷️ PR Label

on:
  pull_request_target:

jobs:
  pr-label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v6
        # Uses .github/labeler.yml definitions
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
