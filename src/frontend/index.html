<!doctype html>
<!-- wa-cloak: FOUCE backstop, hides page until all custom elements are defined (2s max) -->
<html lang="en" class="wa-cloak">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Drone Tasking Manager - Together, We Map. Open. Accurate. Accessible. An open source solution to harness the power of the crowd to generate high-resolution aerial maps."
    />
    <title>Drone Tasking Manager</title>

    <!-- Preload hero background image for fast LCP -->
    <link rel="preload" as="image" href="/images/DroneTM-bg.jpg" fetchpriority="high" />

    <!-- Preconnect to Google Fonts for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts with display=swap to prevent render blocking -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400&display=swap"
    />
    <!-- HOT fonts (not bundled in @hotosm/ui) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;700&family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@400;500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined|Material+Symbols+Outlined&display=swap"
      rel="stylesheet"
    />
    <!-- Runtime config MUST load before any JS modules -->
    <script src="/config.js"></script>
  </head>

  <body>
    <div id="backdrop-root"></div>
    <div id="overlay-root"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
