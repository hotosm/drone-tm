<!doctype html>
<html lang="en" class="wa-theme-default wa-palette-hotosm wa-cloak">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#d43f3f" />
    <meta
      name="description"
      content="Check a task's drone photos cover its area, offline, before uploading."
    />
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>DroneTM Photo Check</title>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <img class="brand-logo" src="./favicon.svg" alt="DroneTM" width="28" height="28" />
        <strong class="brand-text">Photo Check</strong>
      </div>
      <div class="header-actions">
        <wa-button href="./" appearance="plain" size="s">
          <wa-icon slot="start" name="arrow-left"></wa-icon>Back to planner
        </wa-button>
      </div>
    </header>

    <main class="app-body">
      <section class="map-pane">
        <div id="map"></div>

        <aside class="check-panel">
          <p class="muted">
            Check one task at a time. Internet isn't needed, and you can also drop files on the map.
          </p>
          <ul class="check-uploads">
            <li>
              <wa-button data-input="photos-input" appearance="outlined" size="s">
                <wa-icon slot="start" name="images"></wa-icon>Upload photos
              </wa-button>
              <span id="photos-summary" class="muted"></span>
            </li>
            <li>
              <wa-button data-input="area-input" appearance="outlined" size="s">
                <wa-icon slot="start" name="draw-polygon"></wa-icon>Upload task area
              </wa-button>
              <span id="area-summary" class="muted"></span>
            </li>
          </ul>
          <!-- No accept="image/*": some browsers then strip GPS tags. -->
          <input id="photos-input" type="file" multiple hidden />
          <input id="area-input" type="file" accept=".geojson,.json" hidden />
          <div id="check-status"></div>
          <wa-button id="next-task" variant="brand" appearance="outlined" size="s">
            <wa-icon slot="start" name="rotate-left"></wa-icon>Clear and check another task
          </wa-button>
          <div class="check-legend muted">
            <span><i class="swatch swatch-missing"></i> no photo nearby</span>
            <span><i class="swatch swatch-gap"></i> missing photo</span>
            <span><i class="swatch swatch-ok"></i> covered</span>
            <span><i class="swatch swatch-buffer"></i> estimated overlap buffer</span>
          </div>
        </aside>
      </section>
    </main>

    <script type="module" src="/src/check/main.ts"></script>
  </body>
</html>
